services:
  - type: web
    name: eventflow-wedding-planner
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: event_planner.db
      - key: APP_PASSCODE
        sync: false
