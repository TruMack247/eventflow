services:
  - type: web
    name: eventflow-wedding-planner
    runtime: docker
    plan: starter
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /data/event_planner.db
      - key: APP_PASSCODE
        sync: false
    disk:
      name: wedding-database-disk
      mountPath: /data
      sizeGB: 1
